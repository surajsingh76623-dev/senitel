spring:
  datasource:
    url: jdbc:h2:mem:sentinel_test_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

sentinel:
  storage:
    location: ./target/test-uploads
    max-file-size-mb: 15
    allowed-extensions:
      - txt
      - log
      - json
      - csv
      - md
      - pdf
      - png
      - jpg
      - jpeg
      - webp
  ai:
    provider: demo
